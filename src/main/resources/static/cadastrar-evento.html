<main>
<section class="page-content">
 <div class="page-heading form-heading">
 <span class="arrow-mark">
 </span>
 	<h1>Cadastrar notícias e eventos</h1>
 	</div>
 <div class="form-layout">
 <form id="evento-form" class="event-form">
  <label for="titulo">Nome do evento:</label>
  <input id="titulo" name="titulo" type="text" maxlength="150" placeholder="Ex: Degustação Guiada" required>
  
  <label for="descricao">Descrição:</label>
  <textarea id="descricao" name="descricao" placeholder="Use esse espaço para explicar como e o que será o evento." required></textarea>
  
  <label for="dataEvento">Data do evento:</label>
  <input class="date-input" id="dataEvento" name="dataEvento" type="date" required>
  
  <label for="local">Local:</label>
  <input id="local" name="local" type="text" placeholder="Ex: Fábrica - Guarulhos" required>
  
  <div class="form-actions">
  <button class="btn btn-small" type="submit">Cadastrar Evento</button>
  
  <button class="btn btn-light btn-small" type="reset">Cancelar</button></div>
  
  <p class="form-status" id="form-aviso" role="status" aria-live="polite"></p>
 </form></div>
 
 
 <section class="section">
   <h2 class="section-title">Eventos cadastrados</h2>
   
    <div class="event-search event-search--block" role="search">
    <label for="busca-eventos" class="visually-hidden">Buscar eventos</label>
    <input id="busca-eventos" type="search" placeholder="Buscar eventos..." autocomplete="off">
  </div>
  
   <div id="eventos-lista" class="events-grid"></div>
 </section>
